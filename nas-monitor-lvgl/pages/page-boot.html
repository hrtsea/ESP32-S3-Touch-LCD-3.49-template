<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boot Screen page-boot[0]</title>
    <style id="theme-vars">
:root {
  /* LVGL NAS Monitor palette — dark dashboard, cyan accent */
  --nas-background: #000000;
  --nas-foreground: #ffffff;
  --nas-card: #0f0f11;
  --nas-card-foreground: #ffffff;
  --nas-popover: #141419;
  --nas-popover-foreground: #ffffff;
  --nas-primary: #40e0d0;
  --nas-primary-foreground: #000000;
  --nas-muted: #333333;
  --nas-muted-foreground: #a0a0a0;
  --nas-border: #333333;
  --nas-input: #333333;
  --nas-ring: #40e0d0;
  --nas-radius-small: 2px;
  --nas-radius-medium: 4px;
  --nas-radius-large: 8px;

  /* Status / state colors */
  --nas-state-success: #00ff00;
  --nas-state-warning: #ffa500;
  --nas-state-error: #ff0000;
  --nas-state-info: #40e0d0;

  /* Extended dashboard surface tokens */
  --nas-surface: #141419;
  --nas-surface-2: #1c1c22;
  --nas-ink: #ffffff;
  --nas-ink-2: #a0a0a0;
  --nas-ink-3: #666666;
  --nas-line: #333333;
  --nas-state-warning: #ff8c00;

  /* Typography */
  --nas-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --nas-font-mono: "JetBrains Mono", "SF Mono", "Fira Code", ui-monospace, monospace;
}

@theme inline {
  --color-background: var(--nas-background);
  --color-foreground: var(--nas-foreground);
  --color-card: var(--nas-card);
  --color-card-foreground: var(--nas-card-foreground);
  --color-popover: var(--nas-popover);
  --color-popover-foreground: var(--nas-popover-foreground);
  --color-primary: var(--nas-primary);
  --color-primary-foreground: var(--nas-primary-foreground);
  --color-muted: var(--nas-muted);
  --color-muted-foreground: var(--nas-muted-foreground);
  --color-border: var(--nas-border);
  --color-input: var(--nas-input);
  --color-ring: var(--nas-ring);
  --radius-sm: var(--nas-radius-small);
  --radius-md: var(--nas-radius-medium);
  --radius-lg: var(--nas-radius-large);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

  }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;

</head>
<body class="min-h-screen font-sans antialiased">
    <main>
<div id="nas-screen" data-dom-id="screen-frame" style="position:relative;width:640px;height:172px;background:var(--nas-background);color:var(--nas-foreground);overflow:hidden;font-family:var(--nas-font-sans);font-size:12px;">
<div data-dom-id="boot-screen" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;">
  <div style="font-size:48px;font-weight:600;color:var(--nas-state-success);margin-bottom:8px;">ZotLab Z6</div>
  <div style="font-size:16px;color:var(--nas-ink-3);margin-bottom:24px;">v1.1.0</div>
  <div style="width:200px;height:8px;background:var(--nas-muted);border-radius:2px;overflow:hidden;margin:0 auto 12px;">
    <div style="width:70%;height:100%;background:var(--nas-state-success);"></div>
  </div>
  <div style="font-size:12px;color:var(--nas-foreground);">Initializing system...</div>
</div>
</div>
</main>
    <script>lucide.createIcons();</script>
</body>
</html>
